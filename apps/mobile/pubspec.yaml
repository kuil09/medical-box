name: medical_box
description: "Private, device-local household medicine organizer."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  drift: ^2.34.3
  file_picker: ^11.0.2
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  http: ^1.4.0
  intl: ^0.20.3
  kakao_flutter_sdk_user: 2.0.0+1
  path: ^1.9.1
  path_provider: ^2.1.6
  phosphoricons_flutter: ^1.0.0
  share_plus: ^12.0.2
  sign_in_with_apple: ^8.1.0
  sqlite3: ^3.5.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
