name: medical_box
description: "Private, device-local household medicine organizer."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  drift: ^2.34.2
  file_picker: ^10.2.0
  flutter_local_notifications: ^19.3.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.0.0
  google_sign_in: ^6.3.0
  http: ^1.4.0
  intl: ^0.20.2
  kakao_flutter_sdk_user: 1.9.7+3
  path: ^1.9.1
  path_provider: ^2.1.5
  phosphoricons_flutter: ^1.0.0
  share_plus: ^11.0.0
  sign_in_with_apple: ^7.0.1
  sqlite3: ^3.5.0
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: ^2.34.5
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
