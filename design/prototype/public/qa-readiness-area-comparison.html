<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Readiness area picker comparison</title>
    <style>
      :root {
        color: #17191c;
        background: #ecece8;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 28px;
      }

      header {
        max-width: 1180px;
        margin: 0 auto 20px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #62676c;
        font-size: 14px;
      }

      main {
        max-width: 1180px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
        margin: 0 auto;
      }

      figure {
        min-width: 0;
        margin: 0;
        padding: 14px;
        border: 1px solid #d6d7d2;
        border-radius: 16px;
        background: #ffffff;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 13px;
        font-weight: 700;
      }

      figcaption span:last-child {
        color: #62676c;
        font-weight: 500;
      }

      .phone-crop {
        width: 100%;
        aspect-ratio: 838 / 1556;
        overflow: hidden;
        border-radius: 12px;
        background: #f6f6f3;
      }

      img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .before img {
        object-fit: contain;
      }

      .after img {
        object-fit: cover;
        object-position: 50% 50%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Readiness area picker</h1>
      <p>Same iPhone flow before and after the responsive interaction change.</p>
    </header>
    <main>
      <figure class="before">
        <figcaption>
          <span>Before</span>
          <span>Eleven labels forced into one row</span>
        </figcaption>
        <div class="phone-crop">
          <img
            src="/qa/readiness-area-picker-before.png"
            alt="Previous single-row category chips"
          />
        </div>
      </figure>
      <figure class="after">
        <figcaption>
          <span>After</span>
          <span>Compact field with a two-column picker</span>
        </figcaption>
        <div class="phone-crop">
          <img
            src="/qa/readiness-area-picker-after.png"
            alt="Updated readiness area bottom sheet"
          />
        </div>
      </figure>
    </main>
  </body>
</html>
