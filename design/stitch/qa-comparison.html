<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cabinet Index V2 Design QA</title>
    <style>
      :root {
        color: #17191c;
        background: #e8e8e3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 28px;
        color: #62676c;
      }

      section {
        margin-bottom: 40px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 18px;
      }

      .comparison {
        display: grid;
        grid-template-columns: repeat(2, 390px);
        gap: 24px;
        align-items: start;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin-bottom: 8px;
        color: #62676c;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      img {
        display: block;
        width: 390px;
        height: 884px;
        object-fit: fill;
        background: #f4f4f0;
        border: 1px solid #c7c8c3;
        box-shadow: 0 12px 30px rgb(23 25 28 / 10%);
      }
    </style>
  </head>
  <body>
    <h1>Cabinet Index V2 — visual comparison</h1>
    <p>Same 390 × 884 viewport and equivalent interaction state.</p>

    <section>
      <h2>Cabinet closed</h2>
      <div class="comparison">
        <figure>
          <figcaption>Stitch source</figcaption>
          <img src="./references/home-closed.jpg" alt="Stitch closed cabinet" />
        </figure>
        <figure>
          <figcaption>Flutter implementation</figcaption>
          <img
            src="../../apps/mobile/test/golden/goldens/cabinet_home_closed.png"
            alt="Flutter closed cabinet"
          />
        </figure>
      </div>
    </section>

    <section>
      <h2>Cabinet open</h2>
      <div class="comparison">
        <figure>
          <figcaption>Stitch source</figcaption>
          <img src="./references/home-open.jpg" alt="Stitch open cabinet" />
        </figure>
        <figure>
          <figcaption>Flutter implementation</figcaption>
          <img
            src="../../apps/mobile/test/golden/goldens/cabinet_home_open.png"
            alt="Flutter open cabinet"
          />
        </figure>
      </div>
    </section>
  </body>
</html>
