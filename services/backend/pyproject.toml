[project]
name = "medical-box-backend"
version = "0.1.0"
description = "Privacy-first API and Korean medicine catalog pipeline for Medical Box."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.4,<2.0",
  "fastapi>=0.140.7,<1.0",
  "httpx>=0.28.1,<1.0",
  "openpyxl>=3.1.5,<4.0",
  "psycopg[binary]>=3.3.4,<4.0",
  "pydantic-settings>=2.10.1,<3.0",
  "pyjwt[crypto]>=2.13.0,<3.0",
  "sqlalchemy>=2.0.41,<3.0",
  "tenacity>=9.1.2,<10.0",
  "typer>=0.16.0,<1.0",
  "uvicorn[standard]>=0.51.0,<1.0",
]

[project.optional-dependencies]
backup = [
  "boto3>=1.40.0,<2.0",
  "boto3-stubs[s3]>=1.40.0,<2.0",
]
dev = [
  "mypy>=2.3.0,<3.0",
  "pytest>=9.1.1,<10.0",
  "pytest-cov>=7.1.0,<8.0",
  "ruff>=0.12.4,<1.0",
  "types-openpyxl>=3.1.5.20250602",
]

[project.scripts]
medical-box-access = "medical_box_api.access:app"
medical-box-backup = "medical_box_api.backup.cli:app"
medical-box-sync = "medical_box_api.catalog.sync:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_box_api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["medical_box_api"]
mypy_path = "src"
