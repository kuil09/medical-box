name: Mobile signed-build verification

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform signed build to verify
        required: true
        type: choice
        default: both
        options:
          - android
          - ios
          - both
      build_name:
        description: Store version in x.y.z form
        required: true
        type: string
        default: 0.1.0
      build_number:
        description: Positive store build number
        required: true
        type: string
        default: "1"
      upload_testflight:
        description: Upload the verified iOS IPA directly to TestFlight
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-release-build
  cancel-in-progress: false

jobs:
  android:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.platform == 'android' || inputs.platform == 'both')
    runs-on: ubuntu-latest
    environment: closed-beta
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Flutter SDK
        env:
          FLUTTER_COMMIT: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd # 3.44.7
          FLUTTER_HOME: ${{ runner.temp }}/flutter
          FLUTTER_VERSION: 3.44.7
        run: |
          set -euo pipefail
          git init "${FLUTTER_HOME}"
          git -C "${FLUTTER_HOME}" remote add origin https://github.com/flutter/flutter.git
          git -C "${FLUTTER_HOME}" fetch \
            --depth 1 \
            origin \
            "refs/tags/${FLUTTER_VERSION}:refs/tags/${FLUTTER_VERSION}"
          git -C "${FLUTTER_HOME}" checkout --detach "refs/tags/${FLUTTER_VERSION}"
          test "$(git -C "${FLUTTER_HOME}" rev-parse HEAD)" = "${FLUTTER_COMMIT}"
          echo "${FLUTTER_HOME}/bin" >> "${GITHUB_PATH}"
          "${FLUTTER_HOME}/bin/flutter" config --no-analytics
      - name: Validate release inputs
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          set -euo pipefail
          [[ "${BUILD_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${BUILD_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          if [[ "${UPLOAD_TESTFLIGHT}" == "true" &&
            "${REQUESTED_PLATFORM}" == "android" ]]; then
            echo "::error title=Invalid release request::TestFlight upload requires the ios or both platform."
            exit 1
          fi
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_STORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
            ANDROID_UPLOAD_CERT_SHA256
            GOOGLE_SERVER_CLIENT_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing release secret::${name} is required."
              exit 1
            fi
          done
      - name: Install Android signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" \
            | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "${ANDROID_STORE_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
          } > android/key.properties
          keytool \
            -list \
            -keystore android/upload-keystore.jks \
            -storepass "${ANDROID_STORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" > /dev/null
      - run: flutter pub get
      - name: Build signed Android app bundle
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          set -euo pipefail
          flutter build appbundle \
            --release \
            --build-name "${BUILD_NAME}" \
            --build-number "${BUILD_NUMBER}" \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=${GOOGLE_SERVER_CLIENT_ID}" \
            --dart-define="KAKAO_NATIVE_APP_KEY=${KAKAO_NATIVE_APP_KEY}"
      - name: Verify Android signature
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          bundle=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "${bundle}"
          keytool -printcert -jarfile "${bundle}" \
            > build/app/outputs/bundle/release/signing-certificate.txt
          expected_fingerprint="$(
            printf '%s' "${ANDROID_UPLOAD_CERT_SHA256}" \
              | tr -d '[:space:]:' \
              | tr '[:lower:]' '[:upper:]'
          )"
          actual_fingerprint="$(
            keytool -printcert -jarfile "${bundle}" -rfc \
              | openssl x509 -noout -fingerprint -sha256 \
              | sed 's/^.*=//' \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )"
          [[ "${expected_fingerprint}" =~ ^[0-9A-F]{64}$ ]]
          if [[ "${actual_fingerprint}" != "${expected_fingerprint}" ]]; then
            echo "::error title=Unexpected Android signing certificate::The AAB certificate does not match ANDROID_UPLOAD_CERT_SHA256."
            exit 1
          fi
          printf '\nVerified SHA-256: %s\n' "${actual_fingerprint}" \
            >> build/app/outputs/bundle/release/signing-certificate.txt
      - name: Remove Android signed output and signing material
        if: always()
        run: ../../.github/scripts/cleanup-mobile-signing-material.sh android

  ios:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.platform == 'ios' || inputs.platform == 'both')
    runs-on: macos-latest
    environment: closed-beta
    env:
      APPLE_SIGN_IN_ENABLED: ${{ vars.APPLE_SIGN_IN_ENABLED == 'true' && vars.APPLE_ACCOUNT_REVOCATION_READY == 'true' && 'true' || 'false' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Flutter SDK
        env:
          FLUTTER_COMMIT: 84fc5cbb223bc12f83d65b647ff8a56caf779ffd # 3.44.7
          FLUTTER_HOME: ${{ runner.temp }}/flutter
          FLUTTER_VERSION: 3.44.7
        run: |
          set -euo pipefail
          git init "${FLUTTER_HOME}"
          git -C "${FLUTTER_HOME}" remote add origin https://github.com/flutter/flutter.git
          git -C "${FLUTTER_HOME}" fetch \
            --depth 1 \
            origin \
            "refs/tags/${FLUTTER_VERSION}:refs/tags/${FLUTTER_VERSION}"
          git -C "${FLUTTER_HOME}" checkout --detach "refs/tags/${FLUTTER_VERSION}"
          test "$(git -C "${FLUTTER_HOME}" rev-parse HEAD)" = "${FLUTTER_COMMIT}"
          echo "${FLUTTER_HOME}/bin" >> "${GITHUB_PATH}"
          "${FLUTTER_HOME}/bin/flutter" config --no-analytics
      - name: Validate release inputs
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.APPLE_EXPORT_OPTIONS_PLIST_BASE64 }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          REQUESTED_APPLE_SIGN_IN: ${{ vars.APPLE_SIGN_IN_ENABLED }}
          APPLE_ACCOUNT_REVOCATION_READY: ${{ vars.APPLE_ACCOUNT_REVOCATION_READY }}
          UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
        run: |
          set -euo pipefail
          [[ "${BUILD_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${BUILD_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${APPLE_SIGN_IN_ENABLED}" == "true" ||
            "${APPLE_SIGN_IN_ENABLED}" == "false" ]]
          if [[ "${REQUESTED_APPLE_SIGN_IN}" == "true" &&
            "${APPLE_ACCOUNT_REVOCATION_READY}" != "true" ]]; then
            echo "::error title=Apple account lifecycle is not ready::Set APPLE_ACCOUNT_REVOCATION_READY only after production revocation configuration and deletion E2E pass."
            exit 1
          fi
          required=(
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_PROVISIONING_PROFILE_BASE64
            APPLE_EXPORT_OPTIONS_PLIST_BASE64
            APPLE_KEYCHAIN_PASSWORD
            GOOGLE_SERVER_CLIENT_ID
            GOOGLE_IOS_CLIENT_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing release secret::${name} is required."
              exit 1
            fi
          done
          if [[ "${UPLOAD_TESTFLIGHT}" == "true" ]]; then
            upload_required=(
              APP_STORE_CONNECT_API_KEY_ID
              APP_STORE_CONNECT_API_ISSUER_ID
              APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64
            )
            for name in "${upload_required[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error title=Missing TestFlight secret::${name} is required for upload."
                exit 1
              fi
            done
            if [[ ! "${APP_STORE_CONNECT_API_KEY_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
              echo "::error title=Invalid App Store Connect key ID::Expected a 10-character key ID."
              exit 1
            fi
            if [[ ! "${APP_STORE_CONNECT_API_ISSUER_ID}" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
              echo "::error title=Invalid App Store Connect issuer ID::Expected a UUID."
              exit 1
            fi
          fi
      - name: Install Apple signing material
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.APPLE_EXPORT_OPTIONS_PLIST_BASE64 }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          set -euo pipefail
          umask 077
          certificate="${RUNNER_TEMP}/distribution.p12"
          profile="${RUNNER_TEMP}/profile.mobileprovision"
          export_options="${RUNNER_TEMP}/ExportOptions.plist"
          keychain="${RUNNER_TEMP}/medical-box.keychain-db"
          printf '%s' "${APPLE_DISTRIBUTION_CERTIFICATE_BASE64}" \
            | base64 -D > "${certificate}"
          printf '%s' "${APPLE_PROVISIONING_PROFILE_BASE64}" \
            | base64 -D > "${profile}"
          printf '%s' "${APPLE_EXPORT_OPTIONS_PLIST_BASE64}" \
            | base64 -D > "${export_options}"
          security create-keychain -p "${APPLE_KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${APPLE_KEYCHAIN_PASSWORD}" "${keychain}"
          security import "${certificate}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${APPLE_KEYCHAIN_PASSWORD}" \
            "${keychain}"
          security list-keychains -d user -s "${keychain}"
          profile_uuid="$(security cms -D -i "${profile}" | plutil -extract UUID raw -)"
          profile_name="$(security cms -D -i "${profile}" | plutil -extract Name raw -)"
          if [[ ! "${profile_uuid}" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "::error title=Invalid provisioning profile::The profile UUID is malformed."
            exit 1
          fi
          if [[ -z "${profile_name}" ]]; then
            echo "::error title=Invalid provisioning profile::The profile name is missing."
            exit 1
          fi
          profile_dir="${HOME}/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "${profile_dir}"
          cp "${profile}" "${profile_dir}/${profile_uuid}.mobileprovision"
          printf '%s' "${profile_uuid}" > "${RUNNER_TEMP}/profile-uuid"
          google_suffix=".apps.googleusercontent.com"
          if [[ "${GOOGLE_IOS_CLIENT_ID}" != *"${google_suffix}" ]]; then
            echo "::error title=Invalid Google iOS client::GOOGLE_IOS_CLIENT_ID must end with ${google_suffix}."
            exit 1
          fi
          google_client_prefix="${GOOGLE_IOS_CLIENT_ID%"${google_suffix}"}"
          google_reversed_client_id="com.googleusercontent.apps.${google_client_prefix}"
          kakao_url_key="${KAKAO_NATIVE_APP_KEY:-unconfigured}"
          {
            printf 'KAKAO_NATIVE_APP_KEY = %s\n' "${kakao_url_key}"
            printf 'GOOGLE_REVERSED_CLIENT_ID = %s\n' "${google_reversed_client_id}"
            printf 'MEDICALBOX_PROVISIONING_PROFILE_SPECIFIER = %s\n' "${profile_name}"
          } > ios/Flutter/ReleaseSecrets.xcconfig
      - run: flutter pub get
      - name: Build signed iOS archive
        env:
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          set -euo pipefail
          flutter build ipa \
            --release \
            --build-name "${BUILD_NAME}" \
            --build-number "${BUILD_NUMBER}" \
            --export-options-plist="${RUNNER_TEMP}/ExportOptions.plist" \
            --dart-define="GOOGLE_SERVER_CLIENT_ID=${GOOGLE_SERVER_CLIENT_ID}" \
            --dart-define="GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID}" \
            --dart-define="KAKAO_NATIVE_APP_KEY=${KAKAO_NATIVE_APP_KEY}" \
            --dart-define="APPLE_SIGN_IN_ENABLED=${APPLE_SIGN_IN_ENABLED}"
      - name: Verify iOS archive signature
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          codesign --verify --deep --strict "${app}"
          codesign -d --entitlements :- "${app}" \
            > build/ios/archive/Runner.xcarchive/medical-box-entitlements.plist
          if ! photo_library_usage="$(
            plutil -extract NSPhotoLibraryUsageDescription raw "${app}/Info.plist"
          )" || [[ -z "${photo_library_usage}" ]]; then
            echo "::error title=Missing photo library purpose::NSPhotoLibraryUsageDescription is required by the packaged iOS dependencies."
            exit 1
          fi
          google_suffix=".apps.googleusercontent.com"
          expected_google_scheme="com.googleusercontent.apps.${GOOGLE_IOS_CLIENT_ID%"${google_suffix}"}"
          actual_google_scheme="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleURLTypes:1:CFBundleURLSchemes:0' \
              "${app}/Info.plist"
          )"
          if [[ "${actual_google_scheme}" != "${expected_google_scheme}" ]]; then
            echo "::error title=Unexpected Google callback scheme::The archived app does not match GOOGLE_IOS_CLIENT_ID."
            exit 1
          fi
      - name: Install App Store Connect upload key
        if: inputs.upload_testflight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          private_keys="${RUNNER_TEMP}/app-store-connect/private_keys"
          key_file="${private_keys}/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "${private_keys}"
          printf '%s' "${APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64}" \
            | base64 -D > "${key_file}"
          if ! grep -q --fixed-strings 'BEGIN PRIVATE KEY' "${key_file}"; then
            echo "::error title=Invalid App Store Connect key::Decoded secret is not a PKCS#8 private key."
            exit 1
          fi
      - name: Validate and upload iOS build to TestFlight
        if: inputs.upload_testflight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [[ "${#ipas[@]}" -ne 1 ]]; then
            echo "::error title=Unexpected IPA output::Expected exactly one IPA, found ${#ipas[@]}."
            exit 1
          fi
          export API_PRIVATE_KEYS_DIR="${RUNNER_TEMP}/app-store-connect/private_keys"
          xcrun altool \
            --validate-app \
            -f "${ipas[0]}" \
            -t ios \
            --apiKey "${APP_STORE_CONNECT_API_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_API_ISSUER_ID}" \
            --output-format json
          xcrun altool \
            --upload-app \
            -f "${ipas[0]}" \
            -t ios \
            --apiKey "${APP_STORE_CONNECT_API_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_API_ISSUER_ID}" \
            --output-format json
      - name: Remove iOS signed output and signing material
        if: always()
        run: ../../.github/scripts/cleanup-mobile-signing-material.sh ios
