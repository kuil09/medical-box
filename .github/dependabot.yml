version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:10"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    groups:
      root-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/design/prototype"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:20"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    groups:
      prototype-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/services/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:30"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "03:40"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    groups:
      mobile-dependencies:
        patterns:
          - "*"
